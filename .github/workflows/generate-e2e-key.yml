name: Generate E2E SA Key
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'GCP project ID containing e2e-test-runner SA'
        required: true
        default: 'agentbase-test-staging'

jobs:
  generate-key:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: staging
    steps:
      - name: Validate project_id input
        env:
          PROJECT_ID: ${{ github.event.inputs.project_id }}
        run: |
          if ! echo "$PROJECT_ID" | grep -qE '^[a-z][a-z0-9-]{4,28}[a-z0-9]$'; then
            echo "ERROR: Invalid project_id '$PROJECT_ID'. Must match GCP project ID pattern: lowercase alphanumeric and hyphens, 6-30 chars."
            exit 1
          fi
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

      - name: Authenticate as e2e-runner SA directly via WIF
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: e2e-test-runner@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          project_id: ${{ env.PROJECT_ID }}

      - name: Enable APIs and grant roles
        run: |
          PROJECT="${{ env.PROJECT_ID }}"
          DEPLOY_SA="firebase-deploy-staging@agentbase-staging.iam.gserviceaccount.com"

          echo "Enabling APIs..."
          gcloud services enable iam.googleapis.com --project "${PROJECT}"
          gcloud services enable cloudbilling.googleapis.com --project "${PROJECT}"
          gcloud services enable compute.googleapis.com --project "${PROJECT}"
          gcloud services enable cloudresourcemanager.googleapis.com --project "${PROJECT}"

          echo "Granting iam.serviceAccountAdmin to deploy SA..."
          gcloud projects add-iam-policy-binding "${PROJECT}" \
            --member="serviceAccount:${DEPLOY_SA}" \
            --role="roles/iam.serviceAccountAdmin" \
            --condition=None 2>&1 || true

          echo "Granting iam.serviceAccountKeyAdmin to deploy SA..."
          gcloud projects add-iam-policy-binding "${PROJECT}" \
            --member="serviceAccount:${DEPLOY_SA}" \
            --role="roles/iam.serviceAccountKeyAdmin" \
            --condition=None 2>&1 || true

          echo "Granting tokenCreator to deploy SA..."
          SA="e2e-test-runner@${PROJECT}.iam.gserviceaccount.com"
          gcloud iam service-accounts add-iam-policy-binding "$SA" \
            --member="serviceAccount:${DEPLOY_SA}" \
            --role="roles/iam.serviceAccountTokenCreator" \
            --project "${PROJECT}" 2>&1 || true

          echo "Granting projectIamAdmin to deploy SA..."
          gcloud projects add-iam-policy-binding "${PROJECT}" \
            --member="serviceAccount:${DEPLOY_SA}" \
            --role="roles/resourcemanager.projectIamAdmin" \
            --condition=None 2>&1 || true

          echo "Granting serviceUsageConsumer to deploy SA..."
          gcloud projects add-iam-policy-binding "${PROJECT}" \
            --member="serviceAccount:${DEPLOY_SA}" \
            --role="roles/serviceusage.serviceUsageAdmin" \
            --condition=None 2>&1 || true

          echo "Granting compute admin to deploy SA..."
          gcloud projects add-iam-policy-binding "${PROJECT}" \
            --member="serviceAccount:${DEPLOY_SA}" \
            --role="roles/compute.admin" \
            --condition=None 2>&1 || true

          echo "Granting firebase admin to deploy SA..."
          gcloud projects add-iam-policy-binding "${PROJECT}" \
            --member="serviceAccount:${DEPLOY_SA}" \
            --role="roles/firebase.admin" \
            --condition=None 2>&1 || true

          echo ""
          echo "=== Granting wizard-required roles to e2e-runner SA ==="
          E2E_SA="e2e-test-runner@${PROJECT}.iam.gserviceaccount.com"

          echo "Granting iam.serviceAccountUser to e2e-runner SA..."
          gcloud projects add-iam-policy-binding "${PROJECT}" \
            --member="serviceAccount:${E2E_SA}" \
            --role="roles/iam.serviceAccountUser" \
            --condition=None 2>&1 || true

          echo "Granting iam.serviceAccountTokenCreator to e2e-runner SA..."
          gcloud projects add-iam-policy-binding "${PROJECT}" \
            --member="serviceAccount:${E2E_SA}" \
            --role="roles/iam.serviceAccountTokenCreator" \
            --condition=None 2>&1 || true

          echo "Granting billing.projectManager to e2e-runner SA..."
          gcloud projects add-iam-policy-binding "${PROJECT}" \
            --member="serviceAccount:${E2E_SA}" \
            --role="roles/billing.projectManager" \
            --condition=None 2>&1 || true

          # NOTE (billing link e2e): project-level billing.projectManager only
          # allows UNLINKING. The wizard e2e performs a real billing LINK after
          # each run's teardown unlinks it, which additionally requires
          # roles/billing.user on the BILLING ACCOUNT (account-level). This SA
          # cannot self-grant account-level roles — run ONCE manually as the
          # billing account owner:
          #   gcloud billing accounts add-iam-policy-binding <BILLING_ACCOUNT> \
          #     --member="serviceAccount:e2e-test-runner@agentbase-test-staging.iam.gserviceaccount.com" \
          #     --role="roles/billing.user"

          echo "Granting secretmanager.admin to e2e-runner SA..."
          gcloud projects add-iam-policy-binding "${PROJECT}" \
            --member="serviceAccount:${E2E_SA}" \
            --role="roles/secretmanager.admin" \
            --condition=None 2>&1 || true

          echo "Granting iam.workloadIdentityPoolAdmin to e2e-runner SA..."
          gcloud projects add-iam-policy-binding "${PROJECT}" \
            --member="serviceAccount:${E2E_SA}" \
            --role="roles/iam.workloadIdentityPoolAdmin" \
            --condition=None 2>&1 || true

      - name: Create e2e SA key
        id: create-key
        run: |
          gcloud iam service-accounts keys create /tmp/sa-key.json \
            --iam-account="e2e-test-runner@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"
          echo "key_path=/tmp/sa-key.json" >> "$GITHUB_OUTPUT"

      - name: Upload SA key as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-sa-key
          path: ${{ steps.create-key.outputs.key_path }}
