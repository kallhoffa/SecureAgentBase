name: Deploy to Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      e2e_type:
        description: 'Which e2e tests to run'
        required: false
        default: 'cli'
        type: choice
        options:
          - cli
          - wizard
          - all
          - none

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Filter CLI-related paths
        # On push-to-main, the CLI e2e only makes sense if the CLI, its e2e
        # suite, or the deploy workflows actually changed — a web-only merge
        # shouldn't burn ~7 min + a GCP VM. Dispatches/releases always run it.
        id: cli-filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          base: ${{ github.ref }}
          filters: |
            cli:
              - 'cli/**'
              - 'tests/e2e/**'
              - '.github/workflows/firebase-deploy-staging.yml'
              - '.github/workflows/firebase-deploy.yml'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:ci

      - name: Run mutation testing (warn only)
        continue-on-error: true
        run: npx stryker run --reporters clear-text
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Enable required APIs on test project (best-effort)
        continue-on-error: true
        env:
          E2E_SA_KEY: ${{ secrets.E2E_SA_KEY }}
        run: |
          printf '%s' "$E2E_SA_KEY" > /tmp/e2e-sa.json
          gcloud auth activate-service-account --key-file=/tmp/e2e-sa.json
          for proj in agentbase-test-staging agentbase-test-production; do
            echo "=== Enabling APIs on $proj ==="
            gcloud services enable serviceusage.googleapis.com --project "$proj" 2>/dev/null || true
            gcloud services enable firestore.googleapis.com --project "$proj" 2>/dev/null || true
            gcloud services enable firebasestorage.googleapis.com --project "$proj" 2>/dev/null || true
            gcloud services enable firebase.googleapis.com --project "$proj" 2>/dev/null || true
            gcloud services enable firebasehosting.googleapis.com --project "$proj" 2>/dev/null || true
            gcloud services enable identitytoolkit.googleapis.com --project "$proj" 2>/dev/null || true
            gcloud services enable iam.googleapis.com --project "$proj" 2>/dev/null || true
            gcloud services enable cloudbilling.googleapis.com --project "$proj" 2>/dev/null || true
            gcloud services enable compute.googleapis.com --project "$proj" 2>/dev/null || true
            gcloud services enable cloudresourcemanager.googleapis.com --project "$proj" 2>/dev/null || true
          done
          # Grant WIF pool admin + other roles to deploy SA (needed for CLI e2e OIDC setup)
          # secretmanager.admin is required for the CLI's SM secret writes (slice 4, map #36)
          # NOTE: must use vars.GCP_SA_STAGING — the deploy SA lives in the
          # agentbase-staging project, NOT agentbase-test-staging (hardcoding
          # the test project grants roles to a phantom SA that OIDC never uses).
          DEPLOY_SA="${{ vars.GCP_SA_STAGING }}"
          for role in roles/iam.workloadIdentityPoolAdmin roles/iam.securityAdmin roles/serviceusage.serviceUsageAdmin roles/secretmanager.admin; do
            gcloud projects add-iam-policy-binding agentbase-test-staging \
              --member="serviceAccount:${DEPLOY_SA}" \
              --role="${role}" 2>/dev/null || true
          done
          gcloud auth revoke --all 2>/dev/null || true
          rm /tmp/e2e-sa.json

      - name: Use default hosting site for staging
        run: jq 'del(.hosting.site)' firebase.json > firebase.tmp.json && mv firebase.tmp.json firebase.json

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_STAGING }}

      - name: Grant deploy SA runtime roles (SM writes + VM creation)
        # The CLI runs as the deploy SA (ADC/WIF) and slice 4 (map #36) writes
        # SM secrets during init; Step 7 also attaches the agent SA to the VM,
        # which requires iam.serviceAccountUser on the SA (without it GCE
        # rejects the create with SERVICE_ACCOUNT_ACCESS_DENIED and tears the
        # instance down to STOPPING). The deploy SA holds projectIamAdmin on
        # the test project, so it can bind these roles to itself; the earlier
        # best-effort loop (e2e SA) is not a reliable source of the grants.
        run: |
          gcloud projects add-iam-policy-binding agentbase-test-staging \
            --member="serviceAccount:${{ vars.GCP_SA_STAGING }}" \
            --role="roles/secretmanager.admin"
          gcloud projects add-iam-policy-binding agentbase-test-staging \
            --member="serviceAccount:${{ vars.GCP_SA_STAGING }}" \
            --role="roles/iam.serviceAccountUser"

      - name: Ensure e2e SA can link billing (best-effort)
        # The wizard e2e now performs a REAL billing link (the previous run's
        # teardown unlinks billing). Linking requires roles/billing.user on the
        # BILLING ACCOUNT (account-level, not project-level) for
        # e2e-test-runner@agentbase-test-staging. This grant is best-effort —
        # CI credentials may lack billing admin on the account. If it fails,
        # run once manually as the billing account owner:
        #   gcloud billing accounts add-iam-policy-binding <BILLING_ACCOUNT> \
        #     --member="serviceAccount:e2e-test-runner@agentbase-test-staging.iam.gserviceaccount.com" \
        #     --role="roles/billing.user"
        continue-on-error: true
        run: |
          E2E_SA="e2e-test-runner@agentbase-test-staging.iam.gserviceaccount.com"
          BILLING_ACCT=""
          # Discover the billing account from a still-linked project (teardown
          # only unlinks agentbase-test-staging).
          for proj in agentbase-test-production agentbase-staging; do
            BILLING_ACCT=$(gcloud billing projects describe "$proj" --format="value(billingAccountName)" 2>/dev/null || true)
            [ -n "$BILLING_ACCT" ] && break
          done
          if [ -z "$BILLING_ACCT" ]; then
            echo "WARNING: could not discover billing account — the e2e billing link will fail until the one-time manual grant above is applied."
            exit 0
          fi
          echo "Discovered billing account: $BILLING_ACCT"
          if gcloud billing accounts get-iam-policy "$BILLING_ACCT" --format="value(bindings.members)" 2>/dev/null | grep -q "$E2E_SA"; then
            echo "e2e SA already has a role on the billing account — skipping grant."
            exit 0
          fi
          gcloud billing accounts add-iam-policy-binding "$BILLING_ACCT" \
            --member="serviceAccount:${E2E_SA}" \
            --role="roles/billing.user" && \
            echo "Granted roles/billing.user on $BILLING_ACCT to $E2E_SA" || \
            echo "WARNING: grant failed (CI credentials lack billing admin on the account). Apply the one-time manual grant above."

      - name: Build
        run: npm run build
        env:
          VITE_APP_ENV: staging
          VITE_FIREBASE_API_KEY_STAGING: ${{ vars.FIREBASE_API_KEY_STAGING }}
          VITE_FIREBASE_AUTH_DOMAIN_STAGING: ${{ vars.FIREBASE_AUTH_DOMAIN_STAGING }}
          VITE_FIREBASE_PROJECT_ID_STAGING: ${{ vars.FIREBASE_PROJECT_ID_STAGING }}
          VITE_FIREBASE_STORAGE_BUCKET_STAGING: ${{ vars.FIREBASE_STORAGE_BUCKET_STAGING }}
          VITE_FIREBASE_MESSAGING_SENDER_ID_STAGING: ${{ vars.FIREBASE_MESSAGING_SENDER_ID_STAGING }}
          VITE_FIREBASE_APP_ID_STAGING: ${{ vars.FIREBASE_APP_ID_STAGING }}
          VITE_FIREBASE_MEASUREMENT_ID_STAGING: ${{ vars.FIREBASE_MEASUREMENT_ID_STAGING }}
          VITE_FIREBASE_APP_CHECK_SITE_KEY_STAGING: ${{ vars.FIREBASE_APP_CHECK_SITE_KEY_STAGING }}
          VITE_GCP_CLIENT_ID: ${{ vars.GCP_CLIENT_ID_STAGING }}
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_APP_MODE: ${{ vars.VITE_APP_MODE }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          VITE_E2E: 'true'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Deploy to Firebase Staging
        run: npx firebase-tools deploy --only hosting,firestore --project ${{ vars.FIREBASE_PROJECT_ID_STAGING }}

      - name: Wait for Staging Deploy
        run: |
          URL="https://${{ vars.FIREBASE_PROJECT_ID_STAGING }}.web.app"
          echo "Waiting for $URL to be reachable..."
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "$URL" 2>/dev/null; then
              echo "Site is up!"
              exit 0
            fi
            echo "Waiting... attempt $i"
            sleep 5
          done
          echo "Site did not become reachable within 150 seconds"
          exit 1

      - name: Enable Firebase Auth and create test user
        env:
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          TOKEN=$(gcloud auth print-access-token 2>/dev/null)
          if [ -n "$TOKEN" ]; then echo "::add-mask::$TOKEN"; fi
          PROJECT=${{ vars.FIREBASE_PROJECT_ID_STAGING }}
          EMAIL="e2e@${PROJECT}.iam.gserviceaccount.com"
          PASSWORD="$E2E_TEST_PASSWORD"

          echo "=== Enabling email/password auth for ${PROJECT} ==="
          curl -s -X PATCH \
            "https://identitytoolkit.googleapis.com/v2/projects/${PROJECT}/config?updateMask=signIn.email.enabled,signIn.email.passwordRequired" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"signIn":{"email":{"enabled":true,"passwordRequired":true}}}'

          echo "=== Creating test user via public signUp API ==="
          RESP=$(curl -s -X POST \
            "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${{ vars.FIREBASE_API_KEY_STAGING }}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${EMAIL}\",\"password\":\"${PASSWORD}\",\"returnSecureToken\":true}")
          USER_ID=$(echo "$RESP" | jq -r '.localId // empty')
          echo "Test user UID: ${USER_ID:-unknown}"

          echo "=== Creating infra_configs document for test user ==="
          if [ -n "$USER_ID" ] && [ "$USER_ID" != "null" ]; then
            curl -s -X PATCH \
              "https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/infra_configs/${USER_ID}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"fields\":{\"e2eTest\":{\"booleanValue\":true},\"createdAt\":{\"timestampValue\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}}"
            echo "infra_configs created for test user"
          else
            echo "WARNING: Could not get test user ID, infra_configs not created"
          fi

      - name: Run Smoke Tests on Staging
        run: npx playwright test e2e/smoke.spec.js --retries=2
        env:
          TEST_URL: https://${{ vars.FIREBASE_PROJECT_ID_STAGING }}.web.app
          E2E_TEST_EMAIL: e2e@${{ vars.FIREBASE_PROJECT_ID_STAGING }}.iam.gserviceaccount.com
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY_STAGING }}

      - name: Generate e2e GCP token via impersonation
        id: gen-e2e-token
        run: |
          if [ -n "${{ vars.E2E_GCP_PROJECT_ID }}" ]; then
            TOKEN=$(gcloud auth print-access-token \
              --impersonate-service-account="e2e-test-runner@${{ vars.E2E_GCP_PROJECT_ID }}.iam.gserviceaccount.com" 2>/dev/null || \
              gcloud auth print-access-token 2>/dev/null || echo "")
            if [ -n "$TOKEN" ]; then
              echo "::add-mask::$TOKEN"
            fi
            echo "token=$TOKEN" >> $GITHUB_OUTPUT
          else
            echo "token=" >> $GITHUB_OUTPUT
          fi

      - name: Run Full E2E Tests on Staging
        if: >-
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.e2e_type == 'wizard' ||
          github.event.inputs.e2e_type == 'all'
        run: |
          npx playwright test --retries=2
        env:
          TEST_URL: https://${{ vars.FIREBASE_PROJECT_ID_STAGING }}.web.app
          E2E_GCP_TOKEN: ${{ steps.gen-e2e-token.outputs.token }}
          E2E_GCP_PROJECT_ID: ${{ vars.E2E_GCP_PROJECT_ID }}
          E2E_FULL: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' && (github.event.inputs.e2e_type == 'wizard' || github.event.inputs.e2e_type == 'all')) && 'true' || '' }}
          E2E_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY_STAGING }}
          E2E_TEST_EMAIL: e2e@agentbase-staging.iam.gserviceaccount.com
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_SA_KEY: ${{ secrets.E2E_SA_KEY }}
          E2E_GITHUB_PAT: ${{ secrets.E2E_GITHUB_PAT }}
          E2E_DISCORD_TOKEN: ${{ secrets.E2E_DISCORD_BOT_TOKEN }}
          E2E_DISCORD_BOT_ADDED: 'true'
          E2E_APP_MODE: 'true'
          E2E_PROJECT_NAME: 'agentbase-testing'
          E2E_GITHUB_OWNER: 'kallhoffa'
          E2E_FIREBASE_STAGING_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID_STAGING }}
          E2E_FIREBASE_PRODUCTION_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID_PRODUCTION }}

      - name: Build CLI
        # Push-to-main: only when cli/e2e/workflow files changed (web-only
        # merges skip the ~7 min CLI e2e + GCP VM). cli/all dispatches: always.
        # Tags never trigger this workflow (push trigger is main-branch only).
        if: >-
          (github.event_name == 'push' && steps.cli-filter.outputs.cli == 'true') ||
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.e2e_type == 'cli' || github.event.inputs.e2e_type == 'all'))
        run: |
          cd cli && npm ci && npm run build && npm pack
          ls -la *.tgz

      - name: Run CLI E2E Tests
        if: >-
          (github.event_name == 'push' && steps.cli-filter.outputs.cli == 'true') ||
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.e2e_type == 'cli' || github.event.inputs.e2e_type == 'all'))
        run: |
          CLI_PKG=$(ls cli/secureagentbase-*.tgz)
          echo "CLI package: $CLI_PKG"
          CLI_PACKAGE="$CLI_PKG" node tests/e2e/cli.spec.mjs
        env:
          GCP_PROJECT_ID: ${{ vars.E2E_GCP_PROJECT_ID }}
          E2E_GITHUB_PAT: ${{ secrets.E2E_GITHUB_PAT }}
          E2E_GITHUB_OWNER: 'kallhoffa'
          E2E_GITHUB_REPO: 'agentbase-testing'
          E2E_DISCORD_TOKEN: ${{ secrets.E2E_DISCORD_BOT_TOKEN }}
          E2E_FULL: 'true'

      - name: Upload logs on failure
        if: failure()
        run: |
          echo "## Staging Deployment or Tests Failed" >> $GITHUB_STEP_SUMMARY
