rules:
  - id: systemd-inline-secrets
    pattern-either:
      - pattern: Environment="$SECRET=$VALUE"
      - pattern: Environment='$SECRET=$VALUE'
      - pattern: Environment="DISCORD_BOT_TOKEN=$...TOKEN"
      - pattern: Environment="GITHUB_PAT=$...PAT"
      - pattern: Environment="KIMAKI_BOT_TOKEN=$...TOKEN"
    paths:
      include:
        - "*.sh"
        - "**/*.sh"
        - "src/framework/infra-setup/scripts.ts"
    message: >-
      Secrets must use EnvironmentFile= with chmod 600, never inline
      Environment= in systemd unit files. Environment= values are world-
      readable via systemctl show.
    severity: ERROR
    languages:
      - bash
      - generic

  - id: serial-console-secrets
    pattern-either:
      - pattern: echo "...$...PAT..." > /dev/ttyS0 ...
      - pattern: echo "...$...TOKEN..." > /dev/ttyS0 ...
      - pattern: echo "...$...SECRET..." > /dev/ttyS0 ...
    message: >-
      Serial console writes must not include secrets or sensitive identifiers.
      /dev/ttyS0 is accessible via GCP Console serial port.
    severity: ERROR
    languages:
      - bash
      - generic

  - id: serial-console-project-id
    pattern: echo "...$...PROJECT..." > /dev/ttyS0 ...
    message: >-
      Serial console writes must not include project identifiers.
      Strip project IDs, zone info, and repo names before writing to /dev/ttyS0.
    severity: WARNING
    languages:
      - bash
      - generic
